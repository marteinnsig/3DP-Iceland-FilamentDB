<section id="portalPageFlexible" class="portal-page" data-portal-page="flexible" hidden>
  <div class="portal-page-heading"><p class="portal-eyebrow">Measured material behavior</p><h1>Flexible Testing</h1><p>Compare mean results for flexible filaments. Hover over a bar for sample statistics, or click to keep them open.</p></div>
  <section class="card flexible-controls" aria-label="Flexible material selection">
    <div id="flexibleFilters" class="flexible-filter-grid"></div>
    <div class="flexible-selection"><div><label for="flexibleFilaments">Filaments</label><select id="flexibleFilaments" multiple size="6" aria-describedby="flexibleSelectionHint"></select><p id="flexibleSelectionHint" class="muted">Click to select or deselect. No selection shows all matching filaments.</p></div><div><button id="flexibleReset" type="button">Reset filters</button><p id="flexibleStatus" role="status"></p></div></div>
  </section>
  <div id="flexibleCharts" aria-live="polite"></div>
</section>
<style id="flexibleTestingStyles">
#portalPageFlexible{padding-bottom:32px}.flexible-controls{padding:20px}.flexible-filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.flexible-filter-grid>div{min-width:0}.flexible-controls label{display:block;color:#cbd5e1;font-weight:600;margin-bottom:7px}.flexible-controls select,.flexible-controls input{width:100%;box-sizing:border-box;background:#111827;color:#e5e7eb;border:1px solid #475569;border-radius:8px;padding:8px;font:inherit}.flexible-controls select[multiple]{min-height:130px}.flexible-controls button{padding:10px 16px;border:1px solid #64748b;border-radius:8px;background:#1e293b;color:#fff;cursor:pointer}.flexible-controls :focus-visible{outline:2px solid #60a5fa;outline-offset:3px}.flexible-selection{display:grid;grid-template-columns:minmax(260px,2fr) 1fr;gap:20px;margin-top:20px}.flexible-controls .muted,#flexibleStatus,.flexible-condition{color:#aab4c5;line-height:1.5}.flexible-chart-card{padding:20px;margin-top:22px}.flexible-chart-card h2{margin:0 0 4px}.flexible-condition{margin:0 0 16px}.flexible-chart-scroll{overflow-x:auto}.flexible-chart-scroll svg{display:block;max-width:none}.flexible-chart-scroll .bar{fill:var(--single,#34d399);cursor:pointer}.flexible-chart-scroll .bar:hover,.flexible-chart-scroll .bar:focus{fill:#60a5fa;outline:none;stroke:#fff;stroke-width:2}.flexible-chart-scroll text{fill:#cbd5e1;font:18px system-ui,sans-serif}.flexible-chart-scroll .flex-mean{font-size:18px;fill:#e5e7eb;font-weight:700}.flexible-chart-scroll .flex-grid{stroke:#334155;stroke-width:1}.flexible-chart-scroll .flex-axis{stroke:#94a3b8;stroke-width:1}.flexible-empty{padding:24px;color:#aab4c5}@media(max-width:650px){.flexible-selection{grid-template-columns:1fr}.flexible-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script id="flexibleTestingScript">
(function(){
'use strict';
const rows=__FLEXIBLE_DATA__;
const sourceIds=['category','type','variant','reinforcement','color','manufacturer','productLine','priceMin','priceMax','priceAvailability','search'];
const labels=['Material category','Base material','Variant / Finish','Reinforcement','Color','Manufacturer','Product line','Minimum MSRP USD/kg','Maximum MSRP USD/kg','Pricing availability','Search'];
const chosen=new Set();let initialized=false;let chartId=0;
const number=value=>typeof value==='number'&&Number.isFinite(value)?new Intl.NumberFormat(undefined,{maximumFractionDigits:3}).format(value):'—';
const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function copyState(source,target){if(source.tagName==='SELECT'){target.replaceChildren(...Array.from(source.options).map(option=>{const copy=document.createElement('option');copy.value=option.value;copy.textContent=option.textContent;copy.selected=option.selected;return copy;}));}else target.value=source.value;}
function sync(){sourceIds.forEach(id=>{const source=document.getElementById(id),mirror=document.getElementById('flexibleFilter_'+id);if(source&&mirror)copyState(source,mirror);});}
function toggleSelect(select){select.addEventListener('mousedown',event=>{if(event.target instanceof HTMLOptionElement){event.preventDefault();event.target.selected=!event.target.selected;select.dispatchEvent(new Event('input',{bubbles:true}));}});}
function element(name,text,className){const result=document.createElement(name);if(text!==undefined)result.textContent=text;if(className)result.className=className;return result;}
function svgElement(name,attrs,text){const result=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([key,value])=>result.setAttribute(key,String(value)));if(text!==undefined)result.textContent=text;return result;}
function tooltip(row){const shore=row.shoreSpecimens||[];return '<strong>'+safe(row.label)+'</strong><br>'+safe(row.metric)+'<br>'+safe(row.condition)+'<br><br>Mean: <strong>'+safe(number(row.mean))+' '+safe(row.unit)+'</strong><br>Specimens n: '+safe(row.specimenCount)+'<br>'+(shore.length?'Between-specimen SD: ':'Sample SD: ')+safe(number(row.standardDeviation))+' '+safe(row.unit)+'<br>'+(shore.length?'Between-specimen CV: ':'CV: ')+safe(number(row.coefficientOfVariation))+'%'+(row.notReachedCount?' <br>Target not reached: '+safe(row.notReachedCount):'')+(shore.length?'<div style="max-height:220px;overflow-y:auto;margin-top:12px"><strong>Within-specimen location statistics</strong>'+shore.map(s=>'<br>Specimen '+safe(s.specimenNumber)+': '+safe(s.readingCount)+' readings<br>Mean: '+safe(number(s.mean))+' '+safe(row.unit)+' · Location SD: '+safe(number(s.standardDeviation))+' · Location CV: '+safe(number(s.coefficientOfVariation))+'%').join('<br>')+'</div>':'');}
function draw(group){
const card=element('section',undefined,'card flexible-chart-card');card.append(element('h2',group[0].metric+' ('+group[0].unit+')'),element('p',group[0].condition,'flexible-condition'));
const measured=group.filter(row=>Number.isFinite(row.mean)&&row.specimenCount>0).sort((a,b)=>b.mean-a.mean||a.label.localeCompare(b.label));
if(!measured.length){card.append(element('p','No measured results for this condition.','flexible-empty'));return card;}
const wrap=element('div',undefined,'flexible-chart-scroll');wrap.id='flexibleChart'+(++chartId);card.append(wrap);
const measure=document.createElement('canvas').getContext('2d');if(measure)measure.font='18px system-ui,sans-serif';
const textWidth=value=>measure?measure.measureText(value).width:Array.from(value).length*12;
const wrapLabel=value=>{const lines=[];let line='';for(const word of String(value).split(/\s+/)){const candidate=line?line+' '+word:word;if(textWidth(candidate)<=364){line=candidate;continue;}if(line){lines.push(line);line='';}for(const character of Array.from(word)){if(line&&textWidth(line+character)>364){lines.push(line);line='';}line+=character;}}if(line)lines.push(line);return lines.length?lines:[''];};
const labelLines=measured.map(row=>wrapLabel(row.label));
const width=Math.max(980,(document.getElementById('flexibleCharts')?.clientWidth||1100)-44),left=400,right=110,top=32,bottom=34;
const rowHeights=labelLines.map(lines=>Math.max(44,lines.length*24+16));const height=top+rowHeights.reduce((sum,value)=>sum+value,0)+bottom;
let lo=Math.min(0,...measured.map(row=>row.mean)),hi=Math.max(0,...measured.map(row=>row.mean));if(hi===lo)hi=lo+1;else{const padding=(hi-lo)*0.12;if(lo<0)lo-=padding;if(hi>0)hi+=padding;}
const plot=width-left-right;const x=value=>left+(value-lo)/(hi-lo)*plot;const baseline=x(0);const svg=svgElement('svg',{width,height,role:'img','aria-label':group[0].metric+' mean results in '+group[0].unit});wrap.append(svg);
svg.append(svgElement('text',{x:8,y:18},'Filament'),svgElement('text',{x:width-right+18,y:18,class:'flex-mean'},'Mean'));
for(let i=0;i<=4;i++){const value=lo+(hi-lo)*i/4;svg.append(svgElement('line',{x1:x(value),x2:x(value),y1:top,y2:height-bottom,class:'flex-grid'}),svgElement('text',{x:x(value),y:height-10,'text-anchor':'middle'},number(value)));}
svg.append(svgElement('line',{x1:baseline,x2:baseline,y1:top,y2:height-bottom,class:'flex-axis'}));
let rowTop=top;
measured.forEach((row,index)=>{const center=rowTop+rowHeights[index]/2,barX=x(row.mean);const bar=svgElement('rect',{x:row.mean===0?baseline-1:Math.min(baseline,barX),y:center-13,width:row.mean===0?2:Math.abs(barX-baseline),height:26,class:'bar',tabindex:0,'aria-label':row.label+', mean '+number(row.mean)+' '+row.unit+', '+row.condition+', n '+row.specimenCount+', sample SD '+number(row.standardDeviation)+', CV '+number(row.coefficientOfVariation)+' percent'});bar.dataset.tip=tooltip(row);bar.append(svgElement('title',{},row.label+' · Mean '+number(row.mean)+' '+row.unit+' · n '+row.specimenCount+' · SD '+number(row.standardDeviation)+' · CV '+number(row.coefficientOfVariation)+'% · '+row.condition));
bar.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();const box=bar.getBoundingClientRect();bar.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:box.x+box.width/2,clientY:box.y+box.height/2}));}else if(event.key==='Escape'&&typeof unlockTooltip==='function')unlockTooltip();});svg.append(bar,svgElement('text',{x:width-right+18,y:center+6,class:'flex-mean'},number(row.mean)));
const label=svgElement('text',{x:8,y:center-(labelLines[index].length-1)*12+6});labelLines[index].forEach((line,lineNo)=>label.append(svgElement('tspan',{x:8,dy:lineNo?24:0},line)));svg.append(label);rowTop+=rowHeights[index];
});return card;
}
function render(){if(!initialized)return;sync();if(typeof unlockTooltip==='function')unlockTooltip();const matching=typeof apply==='function'?apply(rows):rows;const selector=document.getElementById('flexibleFilaments');const materials=new Map(matching.map(row=>[row.materialId,row.label]));for(const id of chosen){if(!materials.has(id))chosen.delete(id);}selector.replaceChildren(...Array.from(materials).sort((a,b)=>a[1].localeCompare(b[1])).map(([id,label])=>{const option=element('option',label);option.value=id;option.selected=chosen.has(id);return option;}));const selected=matching.filter(row=>chosen.size===0||chosen.has(row.materialId));const chartHost=document.getElementById('flexibleCharts');chartHost.replaceChildren();chartId=0;const groups=new Map();for(const row of selected){const key=JSON.stringify([row.metric,row.condition,row.unit]);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row);}document.getElementById('flexibleStatus').textContent=new Set(selected.map(row=>row.materialId)).size+' filaments · '+groups.size+' measurement conditions';if(!groups.size)chartHost.append(element('p','No Flexible measurements match this selection.','card flexible-empty'));for(const group of groups.values())chartHost.append(draw(group));if(typeof attachTips==='function')chartHost.querySelectorAll('.flexible-chart-scroll').forEach(chart=>attachTips(chart.id));}
function init(){if(initialized)return;initialized=true;const host=document.getElementById('flexibleFilters');sourceIds.forEach((id,index)=>{const source=document.getElementById(id);if(!source)return;const mirror=source.cloneNode(false);mirror.id='flexibleFilter_'+id;mirror.removeAttribute('oninput');mirror.removeAttribute('onchange');const field=element('div');const label=element('label',labels[index]);label.htmlFor=mirror.id;field.append(label,mirror);host.append(field);copyState(source,mirror);mirror.addEventListener('input',()=>{if(source.tagName==='SELECT'){Array.from(source.options).forEach(option=>option.selected=Array.from(mirror.selectedOptions).some(selected=>selected.value===option.value));}else source.value=mirror.value;source.dispatchEvent(new Event('input',{bubbles:true}));requestAnimationFrame(render);});if(mirror.multiple)toggleSelect(mirror);source.addEventListener('input',()=>requestAnimationFrame(render));});const selector=document.getElementById('flexibleFilaments');toggleSelect(selector);selector.addEventListener('input',()=>{chosen.clear();Array.from(selector.selectedOptions).forEach(option=>chosen.add(option.value));render();});document.getElementById('flexibleReset').addEventListener('click',()=>{chosen.clear();document.getElementById('reset')?.click();requestAnimationFrame(render);});document.getElementById('reset')?.addEventListener('click',()=>{chosen.clear();requestAnimationFrame(render);});render();}
window.renderFlexibleTesting=render;if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
